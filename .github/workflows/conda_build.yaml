name: Conda Package CI/CD

# Enabled 2026-09-03: toksearch 2.11.0 shipped `toksearch.provenance`, which
# this package builds on. Both things that previously made this workflow
# impossible to pass are resolved -- pixi.toml now takes toksearch as a
# released conda package instead of an editable ../toksearch sibling (a CI
# runner checks out only this repo, so that path never resolved), and the
# recipe pins `toksearch >=2.11.0` so a build cannot produce a package that
# resolves a toksearch lacking the provenance module.
on:
  push:
    branches: [main]
    tags: ['release-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Set staging channel for pre-release builds
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          if [[ "$VERSION" =~ (rc|a|b)[0-9] ]]; then
            echo "EXTRA_CHANNEL=ga-fdp/label/staging" >> $GITHUB_ENV
          fi

      - name: Build Conda package
        env:
          EXTRA_CHANNEL: ${{ env.EXTRA_CHANNEL }}
        run: |
          pixi global install rattler-build
          cd recipe && bash run_build.sh ${HOME}/outdir

      - name: Upload to Anaconda
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          if [[ "$VERSION" =~ (rc|a|b)[0-9] ]]; then
            LABEL="staging"
          else
            LABEL="main"
          fi
          rattler-build upload anaconda \
            --owner ga-fdp \
            --channel "$LABEL" \
            --api-key ${{ secrets.ANACONDA_API_TOKEN }} \
            --force \
            # `*/` not `linux-64/`: this package is noarch: python, so
            # rattler-build writes it to outdir/noarch/. The hardcoded
            # linux-64 path failed the 0.1.1 tag build with "an io error
            # occurred: No such file or directory" -- the build succeeded and
            # then had nothing to upload.
            ${HOME}/outdir/*/*.conda
