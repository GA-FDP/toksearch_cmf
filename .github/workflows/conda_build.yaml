name: Conda Package CI/CD

# DISABLED until toksearch ships a release carrying `toksearch.provenance`.
#
# Two things make this workflow impossible to pass today, both consequences of
# the same release coupling:
#
#   1. pixi.toml takes toksearch as an editable sibling checkout
#      (`path = "../toksearch"`), because no *published* toksearch has the
#      provenance module this package builds on. A CI runner checks out only
#      this repository, so that path does not resolve and
#      `pixi install --locked` fails.
#   2. The recipe's run dependency on toksearch is unpinned for the same
#      reason, so even a successful build would produce a package that
#      resolves a toksearch without `toksearch.provenance` and fails at
#      runtime the moment CmfRun touches a RunContext.
#
# To re-enable, in one change:
#   - point pixi.toml at the released conda toksearch instead of ../toksearch
#   - pin `toksearch >=<that release>` in recipe/recipe.yaml's run:
#   - add a recipe test importing `toksearch.provenance`
#   - restore the push/pull_request/tag triggers below
#
# See docs/superpowers/plans/2026-09-01-toksearch-cmf-provenance.md, Task 23.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   tags: ['release-*']
  # pull_request:
  #   branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Set staging channel for pre-release builds
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          if [[ "$VERSION" =~ (rc|a|b)[0-9] ]]; then
            echo "EXTRA_CHANNEL=ga-fdp/label/staging" >> $GITHUB_ENV
          fi

      - name: Build Conda package
        env:
          EXTRA_CHANNEL: ${{ env.EXTRA_CHANNEL }}
        run: |
          pixi global install rattler-build
          cd recipe && bash run_build.sh ${HOME}/outdir

      - name: Upload to Anaconda
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          if [[ "$VERSION" =~ (rc|a|b)[0-9] ]]; then
            LABEL="staging"
          else
            LABEL="main"
          fi
          rattler-build upload anaconda \
            --owner ga-fdp \
            --channel "$LABEL" \
            --api-key ${{ secrets.ANACONDA_API_TOKEN }} \
            --force \
            ${HOME}/outdir/linux-64/*.conda
