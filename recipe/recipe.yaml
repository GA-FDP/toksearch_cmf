context:
  version: ${{ env.get("PKG_VERSION") }}

package:
  name: toksearch_cmf
  version: ${{ version }}

source:
  path: ..

build:
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    # Bounded here (not left bare like toksearch_mast's `python`) because an
    # unconstrained host solve picks conda-forge's latest interpreter
    # (3.14 at the time of writing), and the published toksearch conda builds
    # (numpy >=1.20,<2) only exist through python 3.12 -- a package built
    # against a newer interpreter can never install alongside a real
    # toksearch release. cmflib caps at <3.14 too, but <3.13 is the binding
    # constraint. ml-metadata 1.21.0 covers 3.10-3.13.
    - python >=3.10,<3.13
    - setuptools
    - pip
    - versioneer
  run:
    - python >=3.10,<3.13
    # FLOOR IS LOAD-BEARING: toksearch 2.11.0 is the first release carrying
    # `toksearch.provenance` -- RunContext, the Provenance ABC, Signal.spec()
    # and `provenance=` on compute_*. That module is the entire contract this
    # package implements against, so anything older resolves to a toksearch
    # without it and CmfRun fails the moment it touches a RunContext. The
    # import test below is the guard.
    - toksearch >=2.11.0
    # cmflib and ml-metadata are ordinary conda packages on ga-fdp as of
    # 2026-09-02 (GA-FDP/cmf_conda, GA-FDP/mlmd_conda) -- no pip fork, no
    # editable ../cmf checkout. ml-metadata is pulled in transitively by
    # cmflib.
    - cmflib
    - dvc

tests:
  - script:
      content:
        - python -c "import toksearch_cmf; assert toksearch_cmf.__version__"
        # Guard the toksearch floor above. A toksearch without
        # `toksearch.provenance` satisfies a bare dependency but breaks
        # CmfRun at runtime, so assert the contract we actually build on
        # rather than mere importability.
        - |
          python -c "
          from toksearch.provenance import RunContext, Provenance
          from toksearch_cmf import CmfRun
          assert issubclass(CmfRun, Provenance)
          print('OK: toksearch.provenance present and CmfRun implements it')
          "
        # The unit suite. The integration test needs a real cmflib+dvc repo
        # and is deselected here; it runs in the dev environment.
        - python -m pytest tests/ -v --deselect tests/test_cmf_run_integration.py
    files:
      source:
        - tests/
    requirements:
      run:
        - pytest

about:
  license: Apache-2.0
  summary: "CMF provenance backend for toksearch"

extra:
  recipe-maintainers:
    - sammuli
