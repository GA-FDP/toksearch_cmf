[workspace]
name = "toksearch_cmf"
channels = ["ga-fdp", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
# No Python pin here (unlike toksearch_mast's ">=3.11,<3.13"): ml-metadata
# 1.21.0 covers CPython 3.10-3.13, so nothing about this package needs one.
# The effective floor comes from toksearch's own dependencies.
python = "*"
# toksearch 2.11.0 is the first release carrying `toksearch.provenance`, which
# is the entire contract this package builds on: RunContext, the Provenance
# ABC, Signal.spec(), and `provenance=` on compute_*. Anything older resolves
# to a toksearch without that module and fails the moment CmfRun touches a
# RunContext. Taken as a conda package now, so its run-dependencies arrive
# transitively and need no mirroring here.
# The dev env floor stays low so it solves against what is published today.
# The PACKAGE floor is >=2.17.0 (recipe/recipe.yaml) -- see the note there.
toksearch = ">=2.11.0"
# cmflib and ml-metadata are conda packages on ga-fdp as of 2026-09-02
# (GA-FDP/cmf_conda, GA-FDP/mlmd_conda). No pip fork, no editable ../cmf, and
# no Python pin: ml-metadata 1.21.0 covers CPython 3.10-3.13, cmflib is noarch.
cmflib = "*"
dvc = "*"
pytest = "*"
setuptools = "*"
pip = "*"
versioneer = "*"

[pypi-dependencies]
toksearch_cmf = { path = ".", editable = true }
